<!DOCTYPE html>
<html>

<head>

    <title>Academic Calendar</title>

    <link rel="stylesheet" href="dashboard.css">

</head>

<body>

    <div class="topbar">

        <h1>Academic Management System</h1>

        <button onclick="toggleMode()" class="logout-btn">
    🌙 Mode
</button>

<a href="dashboard.html">
    <button class="logout-btn">Back</button>
</a>

    </div>

    <div class="hallticket-container">

        <h2>Academic Calendar</h2>

        <div class="ticket-box">

            <label>Select Semester</label>

            <br><br>

            <select id="semester">

                <option>I - I</option>
                <option>I - II</option>
                <option>II - I</option>
                <option>II - II</option>
                <option>III - I</option>
                <option>III - II</option>
                <option>IV - I</option>
                <option>IV - II</option>

            </select>

            <br><br>

            <button class="download-btn" onclick="showCalendar()">
                View Calendar
            </button>

            <br><br><br>

            <div id="calendar-data"></div>

        </div>

    </div>

    <script>

        function showCalendar() {

            let sem = document.getElementById("semester").value;

            let events = "";

            if (sem === "IV - I") {

                events = `

                <tr>
                    <td>01-05-2026</td>
                    <td>Semester Classes Begin</td>
                    <td>Academic</td>
                </tr>

                <tr>
                    <td>15-05-2026</td>
                    <td>Workshop on AI & ML</td>
                    <td>Workshop</td>
                </tr>

                <tr>
                    <td>20-05-2026</td>
                    <td>Mid Examinations Start</td>
                    <td>Exam</td>
                </tr>

                <tr>
                    <td>05-06-2026</td>
                    <td>Industrial Visit</td>
                    <td>Event</td>
                </tr>

                <tr>
                    <td>15-06-2026</td>
                    <td>Summer Holidays Begin</td>
                    <td>Holiday</td>
                </tr>
                `;
            }

            else if (sem === "III - II") {

                events = `

                <tr>
                    <td>01-04-2026</td>
                    <td>Semester Classes Begin</td>
                    <td>Academic</td>
                </tr>

                <tr>
                    <td>12-04-2026</td>
                    <td>Web Development Workshop</td>
                    <td>Workshop</td>
                </tr>

                <tr>
                    <td>25-04-2026</td>
                    <td>Mid Examinations</td>
                    <td>Exam</td>
                </tr>

                <tr>
                    <td>10-05-2026</td>
                    <td>Technical Fest</td>
                    <td>Event</td>
                </tr>

                <tr>
                    <td>25-05-2026</td>
                    <td>Semester Holidays</td>
                    <td>Holiday</td>
                </tr>
                `;
            }

            else {

                events = `

                <tr>
                    <td>01-03-2026</td>
                    <td>Semester Classes Begin</td>
                    <td>Academic</td>
                </tr>

                <tr>
                    <td>10-03-2026</td>
                    <td>Freshers Orientation</td>
                    <td>Event</td>
                </tr>

                <tr>
                    <td>20-03-2026</td>
                    <td>Mid Examinations</td>
                    <td>Exam</td>
                </tr>

                <tr>
                    <td>05-04-2026</td>
                    <td>Science Exhibition</td>
                    <td>Workshop</td>
                </tr>

                <tr>
                    <td>15-04-2026</td>
                    <td>Summer Holidays</td>
                    <td>Holiday</td>
                </tr>
                `;
            }

            document.getElementById("calendar-data").innerHTML = `

            <table>

                <tr>
                    <th>Date</th>
                    <th>Event</th>
                    <th>Category</th>
                </tr>

                ${events}

            </table>

            `;
        }

    </script>
    <script>

function toggleMode() {

    document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {

        localStorage.setItem("theme", "dark");
    }

    else {

        localStorage.setItem("theme", "light");
    }
}

window.onload = function () {

    let savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") {

        document.body.classList.add("dark-mode");
    }
}

</script>

</body>

</html>
